[build]
  # Smoke test (npx playwright install + npm run smoke) was removed from the
  # build command on 2026-05-08 — it pushed total build time past Netlify's
  # 18-minute timeout. Run it locally before pushing instead, or move it to a
  # GitHub Actions workflow if we want it gated in CI.
  command = "npm ci && rm -rf dist node_modules/.vite && npm run build"
  publish = "dist"

[build.environment]
  # Disable secrets scanning for expected environment variables
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY"
  # Omit scripts directory from scanning
  SECRETS_SCAN_OMIT_PATHS = "scripts/**,dist/**"

# ---------------------------------------------------------------------------
# SPA fallback, scoped deliberately.
#
# This used to be a single blanket rule:
#
#   from = "/*"  to = "/index.html"  status = 200
#
# which answered EVERY unmatched path — typos, stale links, scraped junk — with
# HTTP 200 and a copy of the homepage. Google reports that as a soft 404 and it
# suppresses crawling of the real pages, because any bad URL looks like another
# duplicate of the front page.
#
# Netlify serves existing files (the prerendered dist/<route>/index.html pages
# and all hashed assets) before consulting these rules, so the rules below only
# ever catch client-rendered routes that have no file of their own. Anything
# that matches nothing here falls through to dist/404.html with a real 404
# status, which is what we want.
#
# Adding a new client-only route to src/App.tsx means adding it here too —
# otherwise it will 404. Routes listed in scripts/prerender.mjs need no entry.
# ---------------------------------------------------------------------------

# Admin (also disallowed in robots.txt)
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Gated fundraiser/event routes
[[redirects]]
  from = "/golf-outing"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/hockey-for-a-cause"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/topgolf"
  to = "/index.html"
  status = 200

# Database-driven routes — content varies per record, so they can't be
# prerendered from a static route table.
[[redirects]]
  from = "/game/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/stories/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/stories"
  to = "/index.html"
  status = 200

# Legacy per-team URLs kept for backwards compatibility
[[redirects]]
  from = "/team/*"
  to = "/index.html"
  status = 200
